spring.application.name=SpringSecurity
# Enable the web-based H2 console interface
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Connection Details
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate/JPA settings to auto-create tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


spring.security.user.name=asim
spring.security.user.password=asim@123

